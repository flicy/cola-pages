<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分析台 · 交互演示</title>
<style>
/* ── 设计令牌：与 style.css 同源（中性专业 / 单一主色 / hairline 网格）
      表面：应用底 #F7F8FA · 卡片 #FFFFFF · 发丝描边 #E8EAED · 表头底 #F3F4F6 · 分隔 #EEF0F3。
      字号阶梯：单屏 ≤6 档（32 / 24 / 22 / 16 / 13 / 12），12px 为硬下限。
      行高按用途固定：正文 1.65 · 表格 1.5 · 大数字 1.05。
      品牌铜 #4E79A7 仅两处：导航激活下划线、页头站点标识。 ── */
:root{
  --app:#F7F8FA; --card:#FFFFFF; --card-line:#E8EAED; --band:#F3F4F6; --row:#EEF0F3;
  --grid:#EEF0F3; --axis:#D1D5DB;
  --ink:#111827; --ink-2:#1F2937; --sub:#4B5563; --meta:#6B7280;
  --brand:#C4672B;
  --primary:#4E79A7; --c2:#F28E2B; --c3:#59A14F; --c4:#E15759; --c5:#B07AA1; --c6:#76B7B2;
  --g1:#EAF0F6; --g2:#C2D4E4; --g3:#93B0CC; --g4:#6390B5; --g5:#4E79A7;
  --ok:#59A14F; --neg:#E15759; --warn:#E49444; --off:#9CA3AF;
  --paper:var(--app); --paper-2:var(--band); --sheet:var(--card);
  --brown:var(--sub); --muted:var(--meta);
  --line:var(--card-line); --line-2:var(--axis);
  --copper:var(--primary); --copper-d:var(--primary);
  --cop-70:var(--g4); --cop-45:var(--g3); --cop-25:var(--g2);
  --on-dark:#FFFFFF;
  --serif:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --fs-hero:32px; --fs-num:22px; --fs-h1:24px; --fs-h2:16px;
  --fs-body:13px; --fs-axis:12px;
  --lh-hero:1.05; --lh-num:1.15; --lh-h1:1.25; --lh-h2:1.35;
  --lh-body:1.65; --lh-axis:1.3; --lh-label:1.5; --lh-note:1.55; --lh-th:1.4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-width:1024px;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:var(--fs-body);line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased}
svg{display:block}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{display:flex;min-width:1024px;max-width:1280px;margin:0 auto;background:var(--paper)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ── 左导航：12 模块分四组 ─────────────────────────── */
.side{width:214px;flex:0 0 214px;border-right:1px solid var(--line);padding:22px 16px 18px;display:flex;flex-direction:column}
.brand{display:flex;align-items:baseline;gap:7px;margin-bottom:24px;padding-left:4px}
.brand .mark{font-family:var(--sans);font-size:var(--fs-h2);font-weight:600;color:var(--brand);letter-spacing:.01em;line-height:var(--lh-h2)}
.brand .sub{font-size:var(--fs-axis);color:var(--muted);letter-spacing:.12em}
.ngrp{margin-bottom:18px}
.ngrp-t{display:block;font-size:var(--fs-axis);letter-spacing:.12em;color:var(--muted);padding:0 4px 7px;border-bottom:1px solid var(--line);margin-bottom:5px;line-height:var(--lh-axis)}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px 8px 9px;
  color:var(--sub);text-decoration:none;font-size:var(--fs-body);line-height:var(--lh-body);
  border-bottom:2px solid transparent;border-radius:3px 3px 0 0;cursor:pointer}
.nav a .n{font-family:var(--mono);font-size:var(--fs-axis);color:var(--muted)}
.nav a:hover{background:var(--band);color:var(--ink)}
.nav a.on{background:var(--band);color:var(--ink);border-bottom-color:var(--brand);font-weight:600}
.nav a.on .n{color:var(--ink)}
.nav a.lk .n{color:var(--line-2)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:var(--fs-axis);color:var(--brown);line-height:var(--lh-note)}
.side-foot b{display:block;color:var(--ink);font-weight:600;font-size:var(--fs-body);margin-bottom:3px}

/* ── 主区 ───────────────────────────────────────────── */
.main{flex:1;min-width:0;padding:0 40px;display:flex;flex-direction:column}
.ctxbar{padding:12px 0;border-bottom:1px solid var(--card-line);font-size:var(--fs-axis);color:var(--brown);line-height:var(--lh-axis)}
.ctxrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ctxrow2{padding-top:9px;margin-top:9px;border-top:1px solid var(--line);font-size:var(--fs-axis)}
.clab{color:var(--muted)} .dotsep{color:var(--muted);margin:0 2px}
.ctxbar .pj{color:var(--ink);font-weight:600;font-size:var(--fs-body);line-height:var(--lh-label)}
.ctxbar .pj small{display:block;font-weight:400;font-size:var(--fs-axis);color:var(--brown)}
.ctxbar .sep{width:1px;height:22px;background:var(--line)}
.ctxbar b{font-family:var(--mono);color:var(--ink);font-weight:500}
.ctxbar .cov b{color:var(--primary)}
.ctxbar .wm{margin-left:auto;font-size:var(--fs-axis);color:var(--muted);letter-spacing:.08em;border:1px solid var(--line);padding:2px 7px;border-radius:3px}
.switch{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--card-line);background:var(--card);border-radius:3px;padding:3px 9px;
  font-size:var(--fs-axis);color:var(--sub);white-space:nowrap;line-height:var(--lh-axis)}
button.chip{cursor:pointer}
.chip:hover{background:var(--band);border-color:var(--axis);color:var(--ink)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#FFFFFF;font-weight:600}
.chip.on:hover{background:var(--primary);border-color:var(--primary);color:#FFFFFF}
.chip.off{color:var(--off);border-style:dashed}
.chip.off:hover{color:var(--ink)}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;padding:26px 0 22px}
.crumb{font-size:var(--fs-axis);color:var(--brown);letter-spacing:.05em;margin-bottom:7px}
h1{font-family:var(--serif);font-size:var(--fs-h1);font-weight:600;letter-spacing:.015em;line-height:var(--lh-h1)}
.page-head .lead{font-size:var(--fs-body);color:var(--brown);max-width:380px;line-height:var(--lh-body);text-align:right}
.page-head .lead b{color:var(--ink);font-weight:600}

/* KPI 带 */
.kpiband{display:grid;grid-template-columns:322px 1fr 1fr 1fr;background:var(--card);border:1px solid var(--card-line);border-bottom:0;border-radius:6px 6px 0 0;overflow:hidden}
.kpi{padding:16px 22px 15px;border-right:1px solid var(--row);min-width:0}
.kpi:last-child{border-right:0}
.k-lab{font-size:var(--fs-axis);letter-spacing:.05em;color:var(--meta);line-height:var(--lh-th)}
.k-lab em{font-style:normal;color:var(--off);font-family:var(--mono);margin-left:6px}
.k-val{font-family:var(--mono);font-size:var(--fs-num);line-height:var(--lh-num);color:var(--ink);margin-top:5px;letter-spacing:-.01em}
.k-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.k-cmp{font-size:var(--fs-axis);color:var(--brown);margin-top:5px}
.k-cmp .up{color:var(--ok)} .k-cmp .flat{color:var(--neg)}
.k-ns{background:var(--band)}
.k-ns .k-val{font-size:var(--fs-hero);line-height:var(--lh-hero);letter-spacing:-.02em}
.k-ns .k-range{display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
.k-ns .spark{margin-bottom:5px}
.kpi-rail{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--card-line);border-top:0;border-radius:0 0 6px 6px;overflow:hidden}
.kpi-rail .r{padding:11px 22px;border-right:1px solid var(--row);display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.kpi-rail .r:last-child{border-right:0}
.kpi-rail .r .lab{font-size:var(--fs-axis);color:var(--brown)}
.kpi-rail .r .val{font-family:var(--mono);font-size:var(--fs-body);color:var(--ink)}
.kpi-rail .r .val.miss{font-size:var(--fs-axis);color:var(--muted);font-family:var(--sans)}

.sect{display:grid;grid-template-columns:58px 1fr;gap:26px;margin-top:56px}
.sect-l{font-size:var(--fs-axis);letter-spacing:.16em;color:var(--brown);padding-top:3px}
.sect-l b{display:block;font-family:var(--mono);font-size:var(--fs-axis);color:var(--muted);font-weight:400;margin-top:5px}
.sect-body{min-width:0}
.sect-body>h2{font-family:var(--serif);font-size:var(--fs-h2);font-weight:600;line-height:var(--lh-h2);margin-bottom:4px}
.sect-body>.ssub{font-size:var(--fs-body);color:var(--brown);margin-bottom:16px}
.chartbox{margin-top:16px;background:var(--card);border:1px solid var(--card-line);border-radius:6px;padding:18px 20px 20px}
.chartbox:first-child{margin-top:0}
.cb-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:12px}
.cb-head h3{font-size:var(--fs-body);font-weight:600}
.cb-sub{font-size:var(--fs-axis);color:var(--meta)}
.cb-note{font-size:var(--fs-axis);color:var(--brown);margin-top:12px;padding-right:16px;line-height:var(--lh-note)}
.cb-note b{color:var(--ink);font-weight:600}
.cv{position:relative}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--sans)}
.chart .ax{font-family:var(--mono);font-size:var(--fs-axis);fill:var(--meta)}
.chart .ax2{font-size:var(--fs-axis);fill:var(--sub)}
.chart .vl{font-family:var(--mono);font-size:var(--fs-axis);fill:var(--ink)}
.chart .sc{font-family:var(--mono);font-size:var(--fs-axis)}
.chart .hc{font-family:var(--mono);font-size:var(--fs-body)}
.chart .cop{fill:var(--warn)}
.legend{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px;font-size:var(--fs-axis);color:var(--brown)}
.lgitem{display:flex;align-items:center;gap:6px;line-height:20px}
.lgitem.tog{cursor:pointer}
.lgitem.off{opacity:.38}
.lgitem.off .sw{filter:grayscale(1)}
.sw{width:20px;height:0;border-top-width:2px;border-top-style:solid;flex:0 0 auto}
.sw-dash{border-top-style:dashed} .sw-dot{border-top-style:dotted}
.sw.fill{height:10px;border:0;border-radius:1px}

.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:34px}
.cols-2{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.cols-3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}

.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:var(--fs-axis);font-weight:500;color:var(--meta);letter-spacing:.04em;line-height:var(--lh-th);padding:9px 12px;background:var(--band);border-bottom:1px solid var(--card-line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--row);font-size:var(--fs-body);line-height:var(--lh-label);vertical-align:middle}
.tbl th:first-child,.tbl td:first-child{padding-left:12px}
.chartbox .tbl{margin-left:-20px;margin-right:-20px;width:calc(100% + 40px)}
.tbl td.num,.tbl th.num{text-align:right}
.tbl td.big{font-family:var(--mono);font-size:var(--fs-body)}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--ink)}
.tbl th .ar{font-family:var(--mono);margin-left:5px;color:var(--muted);font-size:var(--fs-axis)}
.tbl th.act .ar{color:var(--copper-d)}
.tbl tbody tr{cursor:default}
.tbl tbody tr.clickable{cursor:pointer}
.tbl tbody tr.clickable:hover td{background:rgba(78,121,167,.06)}
.cap{font-size:var(--fs-axis);color:var(--brown);margin-top:8px}

.tag{display:inline-block;font-size:var(--fs-axis);border:1px solid var(--line-2);border-radius:3px;padding:1px 7px;color:var(--brown);white-space:nowrap;line-height:var(--lh-axis)}
.tag.c{border-color:var(--copper-d);color:var(--copper-d)}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.obs{border-style:dashed;color:var(--muted)}

.missstrip{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:3px;padding:9px 12px;margin-top:10px}
.missstrip .mtag{font-size:var(--fs-axis);color:var(--brown);border:1px solid var(--line-2);border-radius:3px;padding:1px 7px;flex:0 0 auto}
.missstrip .mlist{font-size:var(--fs-axis);color:var(--brown);font-family:var(--mono)}
.missstrip .mnote{font-size:var(--fs-axis);color:var(--muted);margin-left:auto}
.hatch{background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(156,163,175,.45) 4px 5px)}

.meters{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:6px}
.meter{margin-top:14px}
.meter .mt{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-axis);color:var(--brown);margin-bottom:7px}
.meter .mt b{font-family:var(--mono);color:var(--ink);font-weight:500;font-size:var(--fs-body)}
.track{display:flex;height:12px;border:1px solid var(--line-2);background:var(--paper-2);border-radius:2px;overflow:hidden}
.track .seg{height:100%;border-right:1px solid var(--sheet)}
.track .seg:last-child{border-right:0}
.track .seg.miss{background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(156,163,175,.55) 4px 5px)}
.track .fill{height:100%;background:var(--copper);border-right:1px solid var(--sheet)}

.panel{border:1px solid var(--card-line);background:var(--card);border-radius:6px;padding:16px 18px}
.panel h4{font-size:var(--fs-body);font-weight:600;margin-bottom:7px}
.panel p{font-size:var(--fs-body);color:var(--brown);line-height:var(--lh-body)}
.panel p+p{margin-top:8px}

.act{border:1px solid var(--card-line);border-radius:6px;background:var(--card);padding:16px 17px 15px;display:flex;flex-direction:column}
.act .an{font-family:var(--mono);font-size:var(--fs-axis);color:var(--primary);letter-spacing:.06em}
.act h4{font-size:var(--fs-body);font-weight:600;line-height:var(--lh-label);margin:8px 0 12px}
.act .ev{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:none}
.act.open .ev{display:block}
.act .evt{font-size:var(--fs-axis);color:var(--brown);letter-spacing:.04em;margin-bottom:8px}
.act dl{display:grid;gap:3px;margin-top:11px;font-size:var(--fs-axis)}
.act dl div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:5px}
.act dt{color:var(--brown)} .act dd{color:var(--ink);text-align:right}
.act .tog{align-self:flex-start;margin-top:10px;font-size:var(--fs-axis);color:var(--copper-d);border-bottom:1px solid var(--copper-d);padding-bottom:1px}
.act .tog:hover{color:var(--ink);border-color:var(--ink)}
.act.cand{border-style:dashed}
.act.cand h4{font-weight:600}
.act.cand .why{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-2);font-size:var(--fs-body);color:var(--brown);line-height:var(--lh-body)}
.act.cand .why ul{margin:6px 0 0 16px}
.act.cand .why li{margin-top:3px}
.act.cand.open .why{display:block}

.footnote{margin-top:56px;border-top:1px solid var(--card-line);padding:13px 0 26px;display:flex;gap:26px;flex-wrap:wrap;font-size:var(--fs-axis);color:var(--brown);line-height:var(--lh-note)}
.footnote .fi{max-width:270px}
.footnote .fk{display:block;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}
.footnote .wm{margin-left:auto;text-align:right;color:var(--muted)}

/* 未接入 / 可解锁 */
.statepanel{border:1px solid var(--card-line);border-radius:6px;background:var(--card);padding:22px 24px;margin-top:8px}
.statepanel .sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.statepanel h2{font-family:var(--serif);font-size:var(--fs-h2);font-weight:600;line-height:var(--lh-h2);margin-bottom:8px}
.statepanel p{font-size:var(--fs-body);color:var(--brown);margin-bottom:6px;max-width:640px}
.statepanel .cols{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);gap:34px}
.statepanel dt{font-size:var(--fs-axis);color:var(--muted);margin-bottom:4px}
.statepanel dd{font-size:var(--fs-body);color:var(--ink);line-height:var(--lh-body)}

/* 抽屉 */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.06);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:440px;max-width:92vw;background:var(--card);
  border-left:1px solid var(--card-line);box-shadow:-10px 0 28px rgba(17,24,39,.07);transform:translateX(100%);transition:transform .22s ease;z-index:50;
  display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 24px 16px;border-bottom:1px solid var(--line-2)}
.drawer .dh .crumb{margin-bottom:6px}
.drawer .dh h3{font-family:var(--serif);font-size:var(--fs-h2);font-weight:600;line-height:var(--lh-h2)}
.drawer .x{font-size:var(--fs-axis);color:var(--brown);border:1px solid var(--line-2);border-radius:3px;padding:3px 9px;flex:0 0 auto}
.drawer .x:hover{color:var(--ink);border-color:var(--muted)}
.drawer .db{padding:20px 24px 32px;overflow:auto}
.dblock{margin-bottom:22px}
.dblock .dlab{font-size:var(--fs-axis);letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.slot{display:flex;gap:16px;align-items:flex-start}
.slotframe{width:126px;flex:0 0 126px;aspect-ratio:9/16;border:1px solid var(--card-line);border-radius:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:8px}
.slotframe span{font-size:var(--fs-axis);color:var(--brown)}
.slotframe small{font-size:var(--fs-axis);color:var(--muted)}
.slot meta,.slotmeta{font-size:var(--fs-axis);color:var(--brown)}
.quote{font-size:var(--fs-body);color:var(--ink);line-height:var(--lh-body);border-left:2px solid var(--copper);padding-left:13px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.dl-list{display:grid;gap:5px;font-size:var(--fs-axis);margin-top:10px}
.dl-list div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:5px}
.dl-list dt{color:var(--brown)} .dl-list dd{color:var(--ink);font-family:var(--mono)}

/* tooltip */
.tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s ease;
  background:var(--card);border:1px solid var(--card-line);border-radius:6px;box-shadow:0 6px 20px rgba(17,24,39,.10);padding:8px 11px;
  font-size:var(--fs-axis);color:var(--ink);line-height:var(--lh-note);min-width:120px}
.tip.on{opacity:1}
.tip .tt{color:var(--brown);letter-spacing:.04em;margin-bottom:5px}
.tip .tr{display:flex;align-items:center;justify-content:space-between;gap:16px}
.tip .tr .nm{display:flex;align-items:center;gap:6px;color:var(--brown)}
.tip .tr .vv{font-family:var(--mono);color:var(--ink)}

/* 重播按钮 */
.replaybtn{position:fixed;right:20px;bottom:18px;z-index:30;font-size:var(--fs-axis);color:var(--sub);
  border:1px solid var(--card-line);border-radius:4px;padding:6px 12px;background:var(--card);letter-spacing:.02em;box-shadow:0 2px 8px rgba(17,24,39,.06)}
.replaybtn:hover{color:var(--ink);border-color:var(--axis);background:var(--band)}

/* 入场动画 */
#view{opacity:1}
#view.entering{opacity:0;transform:translateY(10px)}
#view.enter{opacity:1;transform:none;transition:opacity .2s ease,transform .2s ease}
@media (prefers-reduced-motion: reduce){
  #view,#view.entering{opacity:1!important;transform:none!important;transition:none!important}
  .drawer{transition:none!important}
  .scrim{transition:none!important}
}
@media (max-width:1180px){
  .main{padding:0 24px}
  .kpiband{grid-template-columns:260px 1fr 1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">

<script>
"use strict";
/* =========================================================================
   1. 工具
   ========================================================================= */
const INK="#111827", BROWN="#4B5563", MUTED="#6B7280", LINE="#E8EAED", LINE2="#D1D5DB",
      COP="#4E79A7", COPD="#4E79A7", COPEDGE="#93B0CC", OK="#59A14F", ON="#FFFFFF";
const fm=(x,d=1)=>(+x).toFixed(d);
const nf=n=>(Math.round(n)).toLocaleString("en-US");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function spark(vals,w,h){ w=w||118; h=h||30; // 微型趋势线（宽高缺省）
  const lo=Math.min(...vals),hi=Math.max(...vals),rng=(hi-lo)||1,n=vals.length;
  const X=i=>2+(w-5)*i/(n-1), Y=v=>h-4-(h-9)*(v-lo)/rng;
  const pts=vals.map((v,i)=>fm(X(i))+","+fm(Y(v))).join(" ");
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true">'+
    '<polyline points="'+pts+'" fill="none" stroke="'+COP+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+fm(X(n-1))+'" cy="'+fm(Y(vals[n-1]))+'" r="2.3" fill="'+COP+'"/></svg>';
}

/* 图表注册：id → {kind, ...命中测试数据} */
const CHART={};
const HIDDEN={};              // 图例收起状态 HIDDEN[chartId]=Set(keys)
const isHidden=(id,k)=>(HIDDEN[id]&&HIDDEN[id][k])||false;
function legend(id,items){
  let h='<div class="legend">';
  items.forEach(it=>{
    const cls='lgitem'+(it.tog?' tog':'')+(isHidden(id,it.key)?' off':'');
    const sw=it.style==='fill'
      ?'<span class="sw fill" style="background:'+it.color+'"></span>'
      :'<span class="sw'+(it.style==='dash'?' sw-dash':it.style==='dot'?' sw-dot':'')+'" style="border-top-color:'+it.color+'"></span>';
    h+='<span class="'+cls+'"'+(it.tog?' data-lg="'+id+'" data-key="'+it.key+'"':'')+'>'+sw+esc(it.label)+'</span>';
  });
  return h+'</div>';
}

/* 折线/基准带/区间 —— 通用绘图（viewBox 宽度＝容器实测宽，保证 1:1 字号） */
function plot(cfg){
  const w=cfg.w,h=cfg.h,pad=Object.assign({l:48,r:22,t:20,b:30},cfg.pad||{});
  const labs=cfg.labels,n=labs.length,yMin=cfg.yMin||0,yMax=cfg.yMax;
  const X=i=>pad.l+(w-pad.l-pad.r)*(n===1?.5:i/(n-1));
  const Y=v=>h-pad.b-(h-pad.t-pad.b)*(v-yMin)/((yMax-yMin)||1);
  let s=['<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(cfg.aria||"")+'">'];
  (cfg.yTicks||[]).forEach(t=>{
    const y=Y(t),strong=(t===yMin);
    s.push('<line x1="'+fm(pad.l)+'" y1="'+fm(y)+'" x2="'+fm(w-pad.r)+'" y2="'+fm(y)+'" stroke="'+(strong?LINE2:LINE)+'" stroke-width="1"/>');
    s.push('<text class="ax" x="'+fm(pad.l-8)+'" y="'+fm(y+3)+'" text-anchor="end">'+(cfg.tickFmt?cfg.tickFmt(t):t)+'</text>');
  });
  (cfg.regions||[]).forEach(rg=>{
    const x0=X(rg.x0i),x1=X(rg.x1i);
    s.push('<rect x="'+fm(x0)+'" y="'+fm(pad.t)+'" width="'+fm(x1-x0)+'" height="'+fm(h-pad.t-pad.b)+'" fill="'+(rg.fill||"rgba(78,121,167,0.06)")+'"/>');
    if(rg.label)s.push('<text class="ax cop" x="'+fm((x0+x1)/2)+'" y="'+fm(pad.t+12)+'" text-anchor="middle">'+esc(rg.label)+'</text>');
  });
  if(cfg.band){
    const up=cfg.band.lo.map((v,i)=>fm(X(i))+","+fm(Y(v))).join(" ");
    const dn=cfg.band.hi.map((v,i)=>fm(X(i))+","+fm(Y(v))).reverse().join(" ");
    s.push('<polygon points="'+up+" "+dn+'" fill="'+cfg.band.fill+'"/>');
  }
  const series=[];
  cfg.series.forEach(se=>{
    if(se.hidden||isHidden(cfg.id,se.key))return;
    const pts=se.values.map((v,i)=>[X(i),Y(v),v]);
    s.push('<polyline points="'+pts.map(p=>fm(p[0])+","+fm(p[1])).join(" ")+'" fill="none" stroke="'+se.color+
      '" stroke-width="'+(se.width||1.8)+'" stroke-linejoin="round" stroke-linecap="round"'+(se.dash?' stroke-dasharray="'+se.dash+'"':'')+'/>');
    if(se.endDot){const p=pts[pts.length-1];s.push('<circle cx="'+fm(p[0])+'" cy="'+fm(p[1])+'" r="2.6" fill="'+se.color+'"/>');}
    if(se.dots)pts.forEach((p,i)=>{
      const lv=se.dotLabels&&se.dotLabels[i];
      if(lv!==undefined)s.push('<circle cx="'+fm(p[0])+'" cy="'+fm(p[1])+'" r="3.2" fill="'+se.color+'" stroke="#FFFFFF" stroke-width="1.3"/><text class="vl" x="'+fm(p[0])+'" y="'+fm(p[1]-10)+'" text-anchor="middle">'+esc(lv)+'</text>');
      else s.push('<circle cx="'+fm(p[0])+'" cy="'+fm(p[1])+'" r="2.5" fill="'+se.color+'"/>');
    });
    series.push({key:se.key,name:se.name,color:se.color,fmt:se.fmt||(v=>nf(v)),pts});
  });
  labs.forEach((lb,i)=>s.push('<text class="ax" x="'+fm(X(i))+'" y="'+fm(h-pad.b+21)+'" text-anchor="middle">'+esc(lb)+'</text>'));
  s.push('</svg>');
  CHART[cfg.id]={kind:"plot",w:w,xs:labs.map((_,i)=>X(i)),labels:labs,series};
  return s.join('');
}

/* 横向条（排序） */
function hbar(cfg){
  const w=cfg.w,bh=16,rh=40,top=16,x0=cfg.x0,x1=cfg.x1;
  const h=top+cfg.rows.length*rh-(rh-bh)+10, vmax=cfg.max||Math.max(...cfg.rows.map(r=>r.value));
  let s=['<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(cfg.aria||"")+'">'];
  const bars=[];
  cfg.rows.forEach((r,i)=>{
    const cy=top+i*rh, bw=(x1-x0)*r.value/vmax;
    s.push('<text class="ax2" x="0" y="'+fm(cy+bh*0.76)+'" fill="'+INK+'">'+esc(r.label)+'</text>');
    s.push('<rect x="'+fm(x0)+'" y="'+fm(cy)+'" width="'+fm(x1-x0)+'" height="'+bh+'" fill="#F3F4F6"/>');
    s.push('<rect x="'+fm(x0)+'" y="'+fm(cy)+'" width="'+fm(bw)+'" height="'+bh+'" fill="'+COP+'"/>');
    s.push('<text class="vl" x="'+fm(x1+14)+'" y="'+fm(cy+bh*0.80)+'">'+esc(r.disp)+'</text>');
    bars.push({label:r.label,disp:r.disp,x:x0,y:cy,w:bw,h:bh});
  });
  s.push('</svg>');
  CHART[cfg.id]={kind:"bar",w:w,bars};
  return s.join('');
}

/* 中位数范围条 */
function rangeChart(cfg){
  const w=cfg.w,rows=cfg.rows,x0=cfg.x0,x1=cfg.x1,xmax=cfg.xmax,rh=30,top=20,fmt=cfg.fmt||(v=>v);
  const bottom=top+rh*rows.length-rh+8;
  let s=['<svg class="chart" viewBox="0 0 '+w+' '+(top+rh*rows.length)+'" role="img" aria-label="'+esc(cfg.aria||"")+'">'];
  (cfg.ticks||[]).forEach(t=>{
    const x=x0+(x1-x0)*t/xmax;
    s.push('<line x1="'+fm(x)+'" y1="'+fm(top-8)+'" x2="'+fm(x)+'" y2="'+fm(bottom+2)+'" stroke="'+LINE+'" stroke-width="1" stroke-dasharray="1 3"/>');
    s.push('<text class="ax" x="'+fm(x)+'" y="'+fm(bottom+20)+'" text-anchor="middle">'+fmt(t)+'</text>');
  });
  const bars=[];
  rows.forEach((r,i)=>{
    const cy=top+i*rh+6;
    const xlo=x0+(x1-x0)*r.lo/xmax,xhi=x0+(x1-x0)*r.hi/xmax,xm=x0+(x1-x0)*r.med/xmax;
    s.push('<text class="ax2" x="0" y="'+fm(cy+3)+'" fill="'+INK+'">'+esc(r.name)+'</text>');
    s.push('<text class="ax" x="0" y="'+fm(cy+17)+'">n='+esc(r.n)+'</text>');
    s.push('<line x1="'+fm(xlo)+'" y1="'+fm(cy-1)+'" x2="'+fm(xhi)+'" y2="'+fm(cy-1)+'" stroke="#C2D4E4" stroke-width="7" stroke-linecap="round"/>');
    s.push('<line x1="'+fm(xm)+'" y1="'+fm(cy-8)+'" x2="'+fm(xm)+'" y2="'+fm(cy+6)+'" stroke="'+COP+'" stroke-width="2.6"/>');
    s.push('<text class="vl" x="'+fm(x1+12)+'" y="'+fm(cy+3)+'">'+esc(r.disp)+'</text>');
    if(r.obs)s.push('<text class="ax cop" x="'+fm(x1+12)+'" y="'+fm(cy+18)+'">观察 · 样本不足</text>');
    bars.push({name:r.name,med:r.med,lo:r.lo,hi:r.hi,disp:r.disp,y:cy,h:rh});
  });
  s.push('</svg>');
  CHART[cfg.id]={kind:"range",w:w,bars,fmt:cfg.rfmt||nf};
  return s.join('');
}

/* 100% 堆叠横向条 */
function stackBars(cfg){
  const w=cfg.w,rows=cfg.rows,x0=cfg.x0,x1=cfg.x1,bh=22,rh=46,top=20,full=x1-x0;
  let s=['<svg class="chart" viewBox="0 0 '+w+' '+altH()+'" role="img" aria-label="'+esc(cfg.aria||"")+'">'];
  function altH(){return top+rh*rows.length-rh+bh+14;}
  rows.forEach((r,i)=>{
    const cy=top+i*rh; let x=x0;
    s.push('<text class="ax2" x="0" y="'+fm(cy+14)+'" fill="'+INK+'">'+esc(r.name)+'</text>');
    s.push('<text class="ax" x="0" y="'+fm(cy+29)+'">'+r.total+' 个账号</text>');
    r.seg.forEach(sg=>{
      if(sg.v<=0)return;
      const seg=full*sg.v/r.total;
      s.push('<rect x="'+fm(x)+'" y="'+fm(cy)+'" width="'+fm(Math.max(seg-1.2,.6))+'" height="'+bh+'" fill="'+sg.color+'"/>');
      if(sg.v/r.total>0.15)s.push('<text class="sc" x="'+fm(x+8)+'" y="'+fm(cy+15)+'" fill="'+(sg.tc||INK)+'">'+sg.v+'</text>');
      x+=seg;
    });
    s.push('<text class="ax" x="'+fm(x1+12)+'" y="'+fm(cy+15)+'">存活 '+r.alive+'/'+r.total+'</text>');
  });
  s.push('</svg>');
  return s.join('');
}

/* 时间窗点阵 */
function dotMatrix(cfg){
  const w=cfg.w,h=224,hours=cfg.hours,days=cfg.days,M=cfg.M,x0=48,x1=w-42,y0=28,y1=198,nx=12,ny=7;
  let s=['<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="发布时间窗均播点阵分布，点大小表示均播">'];
  hours.forEach((hh,j)=>{ if(j%2)return; const x=x0+(x1-x0)*j/(nx-1);
    s.push('<text class="ax" x="'+fm(x)+'" y="'+fm(y0-11)+'" text-anchor="middle">'+hh+'</text>'); });
  days.forEach((d,i)=>{ const y=y0+(y1-y0)*i/(ny-1);
    s.push('<text class="ax2" x="0" y="'+fm(y+3)+'" fill="'+MUTED+'">'+d+'</text>'); });
  for(let i=0;i<ny;i++)for(let j=0;j<nx;j++){
    const v=M[i][j],x=x0+(x1-x0)*j/(nx-1),y=y0+(y1-y0)*i/(ny-1);
    if(v===0){s.push('<circle cx="'+fm(x)+'" cy="'+fm(y)+'" r="1.2" fill="#E5E7EB"/>');continue;}
    const r=2.2+(v/5)*4.6,a=0.22+0.72*(v/5);
    s.push('<circle cx="'+fm(x)+'" cy="'+fm(y)+'" r="'+fm(r)+'" fill="rgba(78,121,167,'+fm(a,2)+')"/>');
  }
  (cfg.peaks||[]).forEach(pk=>{ const x=x0+(x1-x0)*pk[1]/(nx-1),y=y0+(y1-y0)*pk[0]/(ny-1);
    s.push('<circle cx="'+fm(x)+'" cy="'+fm(y)+'" r="8" fill="none" stroke="'+INK+'" stroke-width="1"/>'); });
  s.push('</svg>');
  CHART[cfg.id]={kind:"dots",w:w,h:h,x0:x0,x1:x1,y0:y0,y1:y1,nx:nx,ny:ny,M:M,days:days,hours:hours};
  return s.join('');
}

/* 账号状态网格 */
function statusGrid(cfg){
  const w=cfg.w,cs=22,gap=8,rh=46,x0=170,y0=16;
  let s=['<svg class="chart" viewBox="0 0 '+w+' '+(y0+rh*cfg.groups.length-rh+cs+8)+'" role="img" aria-label="账号状态网格">'];
  cfg.groups.forEach((g,i)=>{
    const y=y0+i*rh;
    s.push('<text class="ax2" x="0" y="'+fm(y+13)+'" fill="'+INK+'">'+esc(g.name)+'</text>');
    s.push('<text class="ax" x="0" y="'+fm(y+28)+'">'+g.statuses.length+' 个</text>');
    g.statuses.forEach((st,j)=>{
      const x=x0+j*(cs+gap);
      if(st==="n")s.push('<rect x="'+fm(x)+'" y="'+fm(y)+'" width="'+cs+'" height="'+cs+'" rx="3" fill="'+COP+'"/>');
      else if(st==="l")s.push('<rect x="'+fm(x)+'" y="'+fm(y)+'" width="'+cs+'" height="'+cs+'" rx="3" fill="#FFFFFF" stroke="'+COP+'" stroke-width="1.4"/>');
      else s.push('<rect x="'+fm(x)+'" y="'+fm(y)+'" width="'+cs+'" height="'+cs+'" rx="3" fill="'+INK+'"/><line x1="'+fm(x+4)+'" y1="'+fm(y+cs-4)+'" x2="'+fm(x+cs-4)+'" y2="'+fm(y+4)+'" stroke="#FFFFFF" stroke-width="1.4"/>');
    });
    const lim=g.statuses.filter(z=>z==="l").length, ban=g.statuses.filter(z=>z==="x").length;
    s.push('<text class="ax" x="'+fm(x0+g.statuses.length*(cs+gap)+8)+'" y="'+fm(y+13)+'">'+(g.statuses.length-ban)+' 存活 / '+lim+' 限流</text>');
  });
  s.push('</svg>');
  return s.join('');
}

/* 热力格 */
function heatGrid(cfg){
  const w=cfg.w,cols=cfg.cols,rows=cfg.rows,V=cfg.V,fmt=cfg.fmt;
  const x0=190,cw=Math.max(120,Math.floor((w-x0-30)/cols.length)-6),gap=6,ch=28,top=30;
  let s=['<svg class="chart" viewBox="0 0 '+w+' '+(top+rows.length*(ch+gap))+'" role="img" aria-label="分类与指标热力格">'];
  cols.forEach((c,j)=>s.push('<text class="ax" x="'+fm(x0+j*(cw+gap)+cw/2)+'" y="'+fm(top-12)+'" text-anchor="middle">'+esc(c)+'</text>'));
  rows.forEach((r,i)=>s.push('<text class="ax2" x="0" y="'+fm(top+i*(ch+gap)+ch/2+4)+'" fill="'+INK+'">'+esc(r)+'</text>'));
  for(let j=0;j<cols.length;j++){
    const col=V.map(row=>row[j]),lo=Math.min(...col),hi=Math.max(...col);
    for(let i=0;i<rows.length;i++){
      const t=(V[i][j]-lo)/((hi-lo)||1),a=0.08+0.84*t;
      const x=x0+j*(cw+gap),y=top+i*(ch+gap);
      s.push('<rect x="'+fm(x)+'" y="'+fm(y)+'" width="'+cw+'" height="'+ch+'" fill="rgba(78,121,167,'+fm(a,2)+')"/>');
      s.push('<text class="hc" x="'+fm(x+cw/2)+'" y="'+fm(y+ch/2+4.5)+'" fill="'+(t>=0.62?ON:INK)+'" text-anchor="middle">'+esc(fmt[i][j])+'</text>');
    }
  }
  s.push('</svg>');
  return s.join('');
}

/* 交付时间轴 */
function timeline(cfg){
  const w=cfg.w,h=120,y=62,x0=80,x1=w-80,n=cfg.nodes.length;
  let s=['<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="交付节奏时间轴">'];
  s.push('<line x1="'+fm(x0)+'" y1="'+y+'" x2="'+fm(x1)+'" y2="'+y+'" stroke="'+LINE2+'" stroke-width="1"/>');
  cfg.nodes.forEach((nd,i)=>{
    const x=x0+(x1-x0)*i/(n-1);
    if(nd.st==="done")s.push('<circle cx="'+fm(x)+'" cy="'+y+'" r="5" fill="'+COP+'"/>');
    else if(nd.st==="cur")s.push('<circle cx="'+fm(x)+'" cy="'+y+'" r="6.5" fill="none" stroke="'+COP+'" stroke-width="1.6"/><circle cx="'+fm(x)+'" cy="'+y+'" r="3.2" fill="'+COP+'"/>');
    else s.push('<circle cx="'+fm(x)+'" cy="'+y+'" r="5" fill="#FFFFFF" stroke="'+MUTED+'" stroke-width="1.4"/>');
    s.push('<text class="ax2" x="'+fm(x)+'" y="'+fm(y-16)+'" text-anchor="middle" fill="'+INK+'">'+esc(nd.name)+'</text>');
    s.push('<text class="ax" x="'+fm(x)+'" y="'+fm(y+23)+'" text-anchor="middle">'+esc(nd.date)+'</text>');
  });
  s.push('</svg>');
  return s.join('');
}

/* 微型证据条 */
function miniBars(cfg){
  const w=cfg.w,h=70,items=cfg.items,n=items.length,rh=h/n,x0=64,x1=w-46;
  let s=['<svg class="chart" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'];
  items.forEach((it,i)=>{
    const cy=i*rh+(rh-13)/2,bw=(x1-x0)*it.value/cfg.vmax;
    s.push('<text class="ax" x="0" y="'+fm(cy+10)+'">'+esc(it.label)+'</text>');
    s.push('<rect x="'+fm(x0)+'" y="'+fm(cy)+'" width="'+(x1-x0)+'" height="13" fill="#F3F4F6"/>');
    s.push('<rect x="'+fm(x0)+'" y="'+fm(cy)+'" width="'+fm(bw)+'" height="13" fill="'+(cfg.color||COP)+'"/>');
    s.push('<text class="vl" x="'+fm(x1+8)+'" y="'+fm(cy+10)+'">'+esc(it.disp)+'</text>');
  });
  return s.join('')+'</svg>';
}

const PENDING=[];
function addChart(id,build){PENDING.push({id,build});return '<div class="cv" data-cv="'+id+'"></div>';}
function mountCharts(){
  PENDING.forEach(q=>{
    const el=document.querySelector('[data-cv="'+q.id+'"]');
    if(!el)return;
    const w=Math.max(320,Math.round(el.clientWidth));
    el.innerHTML=q.build(w);
  });
  PENDING.length=0;
}

/* 表格：注册 + 排序 */
const TAB={};
function tableHTML(id){
  const t=TAB[id],cols=t.cols,rows=sortedRows(id);
  let h='<table class="tbl" id="tbl-'+id+'"><thead><tr>';
  cols.forEach(c=>{
    const act=t.sort.k===c.k,arrow=act?(t.sort.dir>0?'↑':'↓'):'↕';
    h+='<th class="'+(c.num?'num ':'')+(c.nosort?'':'sortable ')+(act?'act':'')+'"'+
       (c.nosort?'':' data-tbl="'+id+'" data-k="'+c.k+'"')+(c.w?' style="width:'+c.w+'"':'')+'>'+
       esc(c.label)+(c.nosort?'':'<span class="ar">'+arrow+'</span>')+'</th>';
  });
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr class="'+(t.click?'clickable':'')+'" data-tbl="'+id+'" data-i="'+t.rows.indexOf(r)+'">';
    cols.forEach(c=>{h+='<td class="'+(c.num?'num ':'')+(c.big?'big ':'')+'">'+(c.disp?c.disp(r):esc(r[c.k]))+'</td>';});
    h+='</tr>';
  });
  return h+'</tbody></table>';
}
function sortedRows(id){
  const t=TAB[id];
  if(!t.sort.k)return t.rows.slice();
  const c=t.cols.find(x=>x.k===t.sort.k),dir=t.sort.dir;
  return t.rows.slice().sort((a,b)=>{
    let va=c.sortVal?c.sortVal(a):a[t.sort.k],vb=c.sortVal?c.sortVal(b):b[t.sort.k];
    if(c.type==="num"){va=+va;vb=+vb;}
    return (va>vb?1:va<vb?-1:0)*dir;
  });
}
function mountTable(id,cols,rows,click){TAB[id]={cols,rows,sort:{k:null,dir:1},click:!!click};return '<div id="tw-'+id+'">'+tableHTML(id)+'</div>';}
function rerenderTable(id){const el=document.getElementById('tw-'+id);if(el)el.innerHTML=tableHTML(id);}

    '<h2>'+esc(q[0])+'</h2><p>'+esc(q[1])+'</p>'+
    '<div class="cols"><div><dt>这个模块回答</dt><dd>'+esc(q[0])+'</dd></div>'+
    '<div><dt>怎么解锁</dt><dd>按订单勾选对应模块后自动出现在这里：导航结构不变，未购买的模块显示为可解锁状态，让你看见自己缺哪一层。</dd></div></div></div>';
}
function viewFacebook(p){
  return '<div class="statepanel"><div class="sh"><span class="tag obs">未接入</span>'+
    '<span class="crumb" style="margin:0">'+esc(p.name)+' · 平台无数据</span></div>'+
    '<h2>'+esc(p.reason)+'</h2>'+
    '<p>按约定，未授权平台不猜数、不估算，也不填 0 占位——所以这里没有 KPI，也没有空白的图表。</p>'+
    '<div class="cols">'+p.lines.map(x=>'<div><dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd></div>').join('')+'</div></div>';
}

/* =========================================================================
   4. 状态与渲染循环
   ========================================================================= */
const IMPL={overview:1,accounts:1,content:1,categories:1,report:1};
let STATE={view:"overview",platform:"tiktok",open:null};

function renderNav(){
  let h='';
  NAVGROUPS.forEach(g=>{
    h+='<div class="ngrp"><span class="ngrp-t">'+esc(g[0])+'</span>';
    g[1].forEach(it=>{
      const on=STATE.view===it[0]?' on':'',lk=it[3]?'':' lk';
      h+='<a class="'+(on?on.trim():'')+lk+'" data-view="'+it[0]+'" href="#view='+it[0]+'">'+esc(it[1])+'<span class="n">'+it[2]+'</span></a>';
    });
    h+='</div>';
  });
  document.getElementById('nav').innerHTML=h;
}
function renderCtx(){
  const p=P[STATE.platform];
  let chips='<div class="switch">';
  ["tiktok","instagram","youtube","facebook"].forEach(k=>{
    const q=P[k],on=STATE.platform===k?' on':'',off=q.connected?'':' off';
    chips+='<button class="chip'+on+off+'" data-plat="'+k+'" type="button">'+esc(q.name)+(q.connected?'':'（未接入）')+'</button>';
  });
  chips+='</div>';
  const period=p.period||"—",collect=p.collect||"—",cov=p.connected?p.cov:"—";
  document.getElementById('ctxbar').innerHTML=
    '<div class="ctxrow"><span class="pj">某 AI 工具出海项目<small>示意项目 · 多平台内容分析</small></span>'+
    '<span class="sep"></span><span class="clab">平台</span>'+chips+'<span class="wm">示意数据</span></div>'+
    '<div class="ctxrow ctxrow2"><span>周期 <b>'+esc(period)+'</b></span><span class="dotsep">·</span>'+
    '<span>采集时间 <b>'+esc(collect)+'</b></span><span class="dotsep">·</span>'+
    '<span class="cov">覆盖率 <b>'+esc(cov)+'</b></span></div>';
  document.getElementById('sideFoot').innerHTML='<b>某 AI 工具出海项目</b>'+esc(p.name)+' · '+(p.connected?"3 个平台已接入":"未接入")+
    '<br>'+esc(p.foot||"未接入：授权与字段清单待确认");
}
function renderHead(){
  const p=P[STATE.platform],v=STATE.view;
  let crumb,h1,lead;
  if(!p.connected){crumb="分析 / "+p.name;h1=p.name+" · 未接入";lead="未接入的平台不进主视图：不填 0、不估算、不留白屏。";}
  else if(IMPL[v]){const t=VIEWTITLE[v];crumb=t[0]+(v==="content"?" / "+p.cnt.ver:"");h1=(v==="content"?t[1]+" · "+p.cnt.ver:t[1]);lead=v==="overview"?p.lead:p[v==="accounts"?"acc":v==="content"?"cnt":v==="categories"?"cat3":"rep"].lead;}
  else{const g=NAVGROUPS.find(gr=>gr[1].some(x=>x[0]===v));crumb="分析 / "+g[0]+" / "+(g[1].find(x=>x[0]===v)[1]);h1=g[1].find(x=>x[0]===v)[1];lead="该模块显示为可解锁状态：它回答什么、怎么解锁，都写在这一屏。";}
  document.getElementById('pageHead').innerHTML='<div><div class="crumb">'+esc(crumb)+'</div><h1>'+esc(h1)+'</h1></div>'+
    '<div class="lead">'+lead+'</div>';
}
function renderView(){
  const p=P[STATE.platform],v=STATE.view,h=document.getElementById('view');
  let html=null;
  if(!p.connected)html=viewFacebook(p);
  else if(v==="overview")html=viewOverview(p);
  else if(v==="accounts")html=viewAccounts(p);
  else if(v==="content")html=viewContent(p);
  else if(v==="categories")html=viewCategories(p);
  else if(v==="report")html=viewReport(p);
  else html=viewLocked(v,p);
  h.innerHTML=(p.connected&&IMPL[v])?kpiBand(viewKpi(p,v))+html:'<div style="margin-top:8px"></div>'+html;
  mountCharts();
  if(STATE.platform==="facebook"||!IMPL[v])document.getElementById('view').querySelectorAll('.statepanel').forEach(()=>{});
}
function viewKpi(p,v){
  if(v==="overview")return p.kpi;
  if(v==="accounts")return p.acc;
  if(v==="content")return {ns:p.cnt.ns,i2:p.cnt.i2,i3:p.cnt.i3,i4:p.cnt.i4,rail:p.cnt.rail};
  if(v==="categories")return {ns:p.cat3.ns,i2:p.cat3.i2,i3:p.cat3.i3,i4:p.cat3.i4,rail:p.cat3.rail};
  return {ns:p.rep.ns,i2:p.rep.i2,i3:p.rep.i3,i4:p.rep.i4,rail:p.rep.rail};
}
function renderFooter(){document.getElementById('footnote').innerHTML=footnote(P[STATE.platform]);}

function animateIn(replay){
  const el=document.getElementById('view');
  if(replay){el.classList.remove('enter');el.classList.add('entering');void el.offsetWidth;
    requestAnimationFrame(()=>{el.classList.remove('entering');el.classList.add('enter');});}
}
function render(replay){
  renderNav();renderCtx();renderHead();renderView();renderFooter();
  const el=document.getElementById('view');
  el.classList.remove('entering','enter');
  if(!replay){el.classList.add('entering');void el.offsetWidth;requestAnimationFrame(()=>{el.classList.remove('entering');el.classList.add('enter');});}
  else{el.classList.add('enter');}
}
function updateHash(){
  const parts=['view='+STATE.view,'platform='+STATE.platform];
  if(STATE.open)parts.push('open='+STATE.open);
  try{history.replaceState(null,'','#'+parts.join('&'));}catch(e){}
}

/* =========================================================================
   5. 交互
   ========================================================================= */
document.addEventListener('click',e=>{
  const nav=e.target.closest('.nav a');
  if(nav){e.preventDefault();STATE.view=nav.dataset.view;STATE.open=null;closeDrawer();render();updateHash();return;}
  const pl=e.target.closest('.chip[data-plat]');
  if(pl){STATE.platform=pl.dataset.plat;STATE.open=null;closeDrawer();render();updateHash();return;}
  const th=e.target.closest('th.sortable');
  if(th){const t=TAB[th.dataset.tbl];if(!t)return;const k=th.dataset.k;
    if(t.sort.k===k)t.sort.dir=-t.sort.dir;else{t.sort.k=k;t.sort.dir=1;}rerenderTable(th.dataset.tbl);return;}
  const row=e.target.closest('tr[data-tbl]');
  if(row){const t=TAB[row.dataset.tbl];if(!t||!t.click)return;const r=t.rows[+row.dataset.i];
    if(r&&r._drawer){STATE.open=r._drawer.kind==="ver"?r._drawer.row.id:"cat";openDrawer(r._drawer);}return;}
  const lg=e.target.closest('[data-lg]');
  if(lg){const id=lg.dataset.lg,k=lg.dataset.key;HIDDEN[id]=HIDDEN[id]||{};HIDDEN[id][k]=!HIDDEN[id][k];
    const y=window.scrollY;mountChartsRefresh();window.scrollTo(0,y);return;}
  const tog=e.target.closest('[data-tog]');
  if(tog){const card=tog.closest('.act');card.classList.toggle('open');
    tog.textContent=card.classList.contains('open')?(card.classList.contains('cand')?"收起":"收起证据"):(card.classList.contains('cand')?"看为什么不列":"展开证据");
    if(card.classList.contains('open'))mountActionCharts(card);return;}
  if(e.target.closest('#scrim')||e.target.closest('.drawer .x')){closeDrawer();return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
document.getElementById('replay').addEventListener('click',()=>animateIn(true));

/* 图例收起后重画当前视图里的图表（保留表格排序等） */
function mountChartsRefresh(){
  document.querySelectorAll('.cv').forEach(el=>{el.innerHTML='';});
  // 重新渲染视图内容（会重建 CV 占位），但保留滚动与打开态
  const p=P[STATE.platform],v=STATE.view;
  if(p.connected&&IMPL[v])renderView();else renderView();
}
/* 动作卡展开时按容器重算证据微图宽度 */
function mountActionCharts(card){
  const acts=P[STATE.platform].rep.actions;
  const idx=card.dataset.act;
  if(idx==="cand")return;
  const a=acts[+idx];const svg=card.querySelector('.ev svg');
  if(!svg)return;
  const w=Math.max(160,Math.round(card.querySelector('.ev').clientWidth));
  svg.setAttribute('viewBox','0 0 '+w+' 70');
  card.querySelector('.ev').innerHTML=miniBars({w:w,items:a.ev,vmax:a.vmax,color:a.muted?MUTED:COP})+
    '<dl>'+card.querySelector('.ev dl').innerHTML+'</dl>';
}

/* 抽屉 */
function openDrawer(d){
  const dr=document.getElementById('drawer');
  dr.innerHTML=d.kind==="ver"?drawerVer(d):drawerCat(d);
  dr.classList.add('open');dr.setAttribute('aria-hidden','false');
  document.getElementById('scrim').classList.add('on');
  if(STATE.open){updateHash();}
}
function closeDrawer(){
  const dr=document.getElementById('drawer');
  if(!dr.classList.contains('open'))return;
  dr.classList.remove('open');dr.setAttribute('aria-hidden','true');
  document.getElementById('scrim').classList.remove('on');STATE.open=null;updateHash();
}
function drawerVer(d){
  const r=d.row,p=d.p;
  return '<div class="dh"><div><div class="crumb">单条内容 / '+esc(r.id)+'</div><h3>'+esc(r.title)+'</h3></div>'+
    '<button class="x" type="button">关闭</button></div><div class="db">'+
    '<div class="dblock"><div class="dlab">成品位</div><div class="slot">'+
    '<div class="slotframe hatch"><span>成品预览位</span><small>示意 · 未加载视频</small></div>'+
    '<div><div class="slotmeta">'+esc(p.name)+' · '+esc(r.slot)+'</div>'+
    '<div class="dl-list"><div><dt>类别</dt><dd>'+esc(r.cat)+'</dd></div>'+
    '<div><dt>7 日播放</dt><dd>'+esc(r.play)+'</dd></div>'+
    '<div><dt>互动率</dt><dd>'+esc(r.eng)+'</dd></div>'+
    '<div><dt>进站 / 注册</dt><dd>'+esc(r.click)+' / '+esc(r.reg)+'</dd></div></div></div></div></div>'+
    '<div class="dblock"><div class="dlab">开头三秒转录</div><div class="quote">'+esc(r.tr)+'</div></div>'+
    '<div class="dblock"><div class="dlab">标签</div><div class="tags">'+r.tags.map(t=>'<span class="tag c">'+esc(t)+'</span>').join('')+'</div></div>'+
    '<div class="dblock"><div class="dlab">2 / 7 / 28 日三窗口对比</div>'+
    miniBars({w:380,vmax:r.w[2],items:[{label:"2 日",value:r.w[0],disp:nf(r.w[0])},{label:"7 日",value:r.w[1],disp:nf(r.w[1])},{label:"28 日",value:r.w[2],disp:nf(r.w[2])}]})+
    '<div class="dl-list">'+r.w.map((x,i)=>'<div><dt>'+["2 日","7 日","28 日"][i]+'</dt><dd>'+nf(x)+'</dd></div>').join('')+'</div></div>'+
    '</div>';
}
function drawerCat(d){
  const c=d.cat,p=d.p;
  return '<div class="dh"><div><div class="crumb">内容分类 / '+esc(c.name)+'</div><h3>'+esc(c.name)+'</h3></div>'+
    '<button class="x" type="button">关闭</button></div><div class="db">'+
    '<div class="dblock"><div class="dlab">该类型明细 · '+esc(p.name)+'</div><div class="dl-list">'+
    '<div><dt>内容量</dt><dd>'+nf(c.n)+'</dd></div><div><dt>播放</dt><dd>'+nf(c.play)+'</dd></div>'+
    '<div><dt>均播</dt><dd>'+nf(c.avg)+'</dd></div><div><dt>播放中位数</dt><dd>'+nf(c.med)+'</dd></div>'+
    '<div><dt>进站</dt><dd>'+nf(c.click)+'</dd></div><div><dt>进站率</dt><dd>'+esc(c.cr)+'</dd></div>'+
    '<div><dt>注册率</dt><dd>'+esc(c.rr)+'</dd></div><div><dt>3 秒留存</dt><dd>'+esc(c.s3)+'</dd></div></div></div>'+
    '<div class="dblock"><div class="dlab">播放分布（P25–中位数–P75）</div>'+
    miniBars({w:380,vmax:c.med*1.6||1,items:[{label:"P25",value:c.p25,disp:nf(c.p25)},{label:"中位数",value:c.med,disp:nf(c.med)},{label:"P75",value:c.p75,disp:nf(c.p75)}]})+
    '</div>'+
    '<div class="dblock"><div class="dlab">状态</div><p class="cb-note" style="margin:0">该类型当前标注：'+esc(c.st[1])+'。样本 '+
    nf(c.n)+' 条；样本 <5 的类别只给观察、不出结论。</p></div></div>';
}

/* 从 hash 恢复状态（便于深链 / 无头截图） */
function readHash(){
  const h=location.hash.replace(/^#/,'');if(!h)return;
  const q={};h.split('&').forEach(kv=>{const[a,b]=kv.split('=');q[a]=decodeURIComponent(b||'');});
  if(q.view&&(IMPL[q.view]||LOCKED[q.view]))STATE.view=q.view;
  if(q.platform&&P[q.platform])STATE.platform=q.platform;
  STATE.open=q.open||null;
}
let rTid=null;
window.addEventListener('resize',()=>{clearTimeout(rTid);rTid=setTimeout(()=>{
  const y=window.scrollY;const svgless=document.getElementById('view');
  PENDING.length=0;renderView();window.scrollTo(0,y);},160);});

/* tooltip */
const tipEl=document.getElementById('tip');
function showTip(html,x,y){
  tipEl.innerHTML=html;tipEl.classList.add('on');
  const r=tipEl.getBoundingClientRect();
  let left=x+12,top=y+12;
  if(left+r.width>window.innerWidth-8)left=x-12-r.width;
  if(top+r.height>window.innerHeight-8)top=y-12-r.height;
  tipEl.style.left=Math.max(8,left)+'px';tipEl.style.top=Math.max(8,top)+'px';
}
function hideTip(){tipEl.classList.remove('on');}
function swatch(c){return '<span class="sw" style="display:inline-block;width:14px;border-top-color:'+c+'"></span>';}
function delegateTip(){
  document.addEventListener('mousemove',e=>{
    const cv=e.target.closest?e.target.closest('.cv'):null;
    if(!cv){hideTip();return;}
    const info=CHART[cv.dataset.cv];if(!info){hideTip();return;}
    const svg=cv.querySelector('svg');if(!svg){hideTip();return;}
    const r=svg.getBoundingClientRect(),k=info.w/r.width,sx=(e.clientX-r.left)*k,sy=(e.clientY-r.top)*(svg.viewBox.baseVal.height/r.height);
    let html=null;
    if(info.kind==="plot"){
      let best=0,bd=1e9;info.xs.forEach((xx,i)=>{const d=Math.abs(xx-sx);if(d<bd){bd=d;best=i;}});
      if(bd>70){hideTip();return;}
      html='<div class="tt">'+esc(info.labels[best])+'</div>';
      info.series.forEach(s=>{const p=s.pts[best];if(!p)return;html+='<div class="tr"><span class="nm">'+swatch(s.color)+esc(s.name)+'</span><span class="vv">'+esc(s.fmt(p[2]))+'</span></div>';});
    } else if(info.kind==="bar"){
      const hit=info.bars.find(b=>sy>=b.y-4&&sy<=b.y+b.h+4);if(!hit){hideTip();return;}
      html='<div class="tt">'+esc(hit.label)+'</div><div class="tr"><span class="nm">'+swatch(COP)+'播放贡献</span><span class="vv">'+esc(hit.disp)+'</span></div>';
    } else if(info.kind==="range"){
      const hit=info.bars.find(b=>sy>=b.y-b.h/2&&sy<=b.y+b.h/2);if(!hit){hideTip();return;}
      html='<div class="tt">'+esc(hit.name)+'</div><div class="tr"><span class="nm">'+swatch(COP)+'中位数</span><span class="vv">'+esc(hit.disp)+'</span></div>'+
        '<div class="tr"><span class="nm">P25–P75</span><span class="vv">'+info.fmt(hit.lo)+'–'+info.fmt(hit.hi)+'</span></div>';
    } else if(info.kind==="dots"){
      const j=Math.round((sx-info.x0)/((info.x1-info.x0)/(info.nx-1))),i=Math.round((sy-info.y0)/((info.y1-info.y0)/(info.ny-1)));
      if(i<0||i>6||j<0||j>11){hideTip();return;}
      html='<div class="tt">'+info.days[i]+' · '+info.hours[j]+':00</div><div class="tr"><span class="nm">该窗均播档</span><span class="vv">'+info.M[i][j]+' / 5</span></div>';
    }
    if(!html){hideTip();return;}
    showTip(html,e.clientX,e.clientY);
  });
  document.addEventListener('mouseleave',hideTip);
}

/* 启动 */
renderNav();renderCtx();renderHead();renderView();renderFooter();delegateTip();
readHash();
if(STATE.open){
  // 深链打开抽屉：先渲染对应视图，再按 open 值定位行
  render();
  const p=P[STATE.platform];
  if(p.connected&&STATE.view==="content"){const row=p.cnt.rows.find(x=>x.id===STATE.open);
    if(row)openDrawer({kind:"ver",row,p});}
  else{const c=p.cats&&p.cats.find(x=>x.name===STATE.open);if(c)openDrawer({kind:"cat",cat:c,p});}
} else render();
updateHash();
</script>
