<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>五月天城市唱片 · 把此歌唱成一场五月天</title>
<style>
/* ===== 水彩演唱会 · 设计令牌（七色板，来源 design/watercolor-concert-SPEC.md）===== */
:root{
  --ink:#101722;        /* 深墨蓝 */
  --paper:#F6F0E5;      /* 米白奶油 */
  --blue:#87BCEB;       /* 浅蓝 */
  --coral:#F19A80;      /* 珊瑚橙 */
  --mint:#8BD8CF;       /* 薄荷绿 */
  --lav:#B9A7E8;        /* 淡紫 */
  --gold:#E9D269;       /* 暖黄 */
  --ink-60:rgba(16,23,34,.6);
  --ink-30:rgba(16,23,34,.28);
  --paper-line:rgba(16,23,34,.14);
  --serif:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  --mono:"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  min-height:100dvh;background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;font-size:15px;line-height:1.6;
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
.mono{font-family:var(--mono);letter-spacing:.04em}

/* ===== 手机画布（桌面居中，移动满宽）===== */
.phone{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:96px}
@media(min-width:520px){
  body{background:#EAEAE7}
  .phone{background:var(--paper);box-shadow:0 24px 60px rgba(16,23,34,.14);border-radius:0 0 28px 28px}
}

/* ===== 屏切换 ===== */
.scr{display:none;animation:scrIn .32s var(--ease)}
.scr.active{display:block}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== 顶栏与标题 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 16px) 20px 0}
.round-icon{
  width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  border:1.5px solid var(--ink);color:var(--ink);background:transparent;
  transition:transform .25s var(--ease),background .25s var(--ease)
}
.round-icon:active{transform:scale(.92);background:rgba(16,23,34,.06)}
.big-title{
  font-family:var(--serif);font-weight:600;color:var(--ink);
  font-size:clamp(42px,12vw,58px);letter-spacing:.14em;text-align:center;
  padding:26px 0 6px;position:relative;line-height:1.15
}
.big-title.light{color:#fff}
.star4{display:inline-block;width:.42em;height:.42em;vertical-align:.08em;margin-left:.18em;color:var(--gold)}
.wave-sep{display:flex;justify-content:center;padding:2px 0 18px;color:var(--ink-60)}

/* ===== 屏1 · 今晚见 ===== */
.stage-art{margin:6px 20px 0;border-radius:22px;overflow:hidden;border:3px solid #fff;box-shadow:0 14px 34px rgba(16,23,34,.13)}
.stage-art img{width:100%;aspect-ratio:1/1;object-fit:cover}
.entry-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px 20px 8px}
.sticker{
  background:#fff;border:2.5px solid #fff;border-radius:20px;padding:16px 14px;text-align:left;
  box-shadow:0 10px 24px rgba(16,23,34,.10);transition:transform .28s var(--ease)
}
.sticker:active{transform:scale(.97)}
.sticker b{display:block;font-size:16px;letter-spacing:.05em}
.sticker span{font-size:12px;color:var(--ink-60)}
.home-foot{text-align:center;color:var(--ink-60);font-size:12px;padding:14px 20px 8px}
.home-slogan{text-align:center;font-family:var(--serif);letter-spacing:.3em;font-size:13px;color:var(--ink);padding-bottom:6px}

/* ===== 屏2 · 抽一首（扇形塔罗卡组）===== */
.draw-hint{text-align:center;color:var(--ink-60);font-size:13px;padding-bottom:14px}
.fan{display:flex;justify-content:center;align-items:flex-end;gap:0;padding:8px 18px 22px;min-height:150px}
.slot{
  width:31%;aspect-ratio:3/4;border-radius:16px;position:relative;flex:0 1 132px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:transform .35s var(--ease)
}
.slot:nth-child(1){transform:rotate(-9deg) translateY(10px)}
.slot:nth-child(3){transform:rotate(9deg) translateY(10px)}
.slot.empty{background:var(--ink);color:rgba(246,240,229,.85);box-shadow:0 10px 22px rgba(16,23,34,.24)}
.slot.empty .no{opacity:.55;font-size:11px}
.slot-word{font-size:12px;letter-spacing:.14em}
.slot.filled{
  background:#fff url('./assets/watercolor-card-back.jpg') center/cover;
  border:3px solid #fff;box-shadow:0 12px 26px rgba(16,23,34,.2)
}
.slot.filled::after{content:'';position:absolute;inset:0;border-radius:13px;background:linear-gradient(180deg,rgba(16,23,34,.05),rgba(16,23,34,.42))}
.slot.filled .no,.slot.filled .slot-city,.slot.filled .slot-mood{position:relative;z-index:1;color:#fff}
.slot.filled .no{font-size:11px;opacity:.75}
.slot-city{font-family:var(--serif);font-size:20px;letter-spacing:.1em}
.slot-mood{font-size:11px;letter-spacing:.2em}
.slot-x{
  position:absolute;top:6px;right:6px;z-index:2;width:22px;height:22px;border-radius:50%;
  background:rgba(255,255,255,.92);color:var(--ink);display:flex;align-items:center;justify-content:center
}
.slot.in{animation:cardIn .38s var(--ease)}
@keyframes cardIn{from{transform:translateY(26px) rotate(-9deg);opacity:0}to{opacity:1}}
.ticket{
  margin:2px 20px 0;background:#fff;border-radius:18px;padding:18px 18px 14px;
  border:2.5px solid #fff;box-shadow:0 14px 30px rgba(16,23,34,.12)
}
.ticket.in{animation:cardIn .38s var(--ease)}
.t-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.t-no{font-size:11px;color:var(--ink-60)}
.t-city{font-family:var(--serif);font-size:15px;letter-spacing:.14em}
.t-text{font-size:16px;line-height:1.65;margin-bottom:10px}
.t-meta{font-size:11px;color:var(--ink-60);padding-top:8px;border-top:1px dashed var(--ink-30)}
.t-hint{font-size:12px;color:var(--ink-60);margin-top:8px;font-style:italic}
.stage-empty{text-align:center;color:var(--ink-60);font-size:13px;padding:18px 30px}
.dots{display:flex;justify-content:center;gap:7px;padding-bottom:12px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink-30)}
.dots i.on{background:var(--ink)}

/* ===== 圆形按钮系统 ===== */
.btn-circle{
  width:64px;height:64px;border-radius:50%;display:inline-flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  background:var(--ink);color:#fff;box-shadow:0 12px 26px rgba(16,23,34,.28);
  transition:transform .25s var(--ease),background .25s var(--ease),opacity .2s
}
.btn-circle:active{transform:scale(.93);background:var(--blue)}
.btn-circle[disabled]{background:var(--paper);color:var(--ink-30);box-shadow:none;cursor:not-allowed}
.btn-circle.small{width:52px;height:52px}
.btn-circle.light-btn{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink-30);box-shadow:0 8px 18px rgba(16,23,34,.10)}
.btn-circle.light-btn:active{background:var(--blue);color:#fff}
.btn-circle .bc-label{font-size:10px;letter-spacing:.12em}
.circle-row{display:flex;justify-content:center;align-items:center;gap:22px;padding:20px 0 10px}
.main-label{text-align:center;font-family:var(--serif);font-size:15px;letter-spacing:.24em;color:var(--ink);padding-bottom:4px}

/* ===== 屏3 · 此刻的歌（回响调频卡式：米白纸底 × 竖版白框卡牌）===== */
.scr-song{min-height:100dvh;background:
  radial-gradient(110% 46% at 50% -6%,rgba(135,188,235,.14),transparent 62%),
  var(--paper);color:var(--ink);padding-bottom:120px}
.scr-song .topbar{border:0}
.round-icon.ghost{border-color:var(--ink-30);color:var(--ink)}
.tarot-card{
  margin:14px 38px 0;background:#fff;border-radius:22px;padding:12px 12px 58px;
  box-shadow:0 24px 52px rgba(16,23,34,.16),0 4px 12px rgba(16,23,34,.06);position:relative
}
.tarot-card .pol-img{border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:#dfe9f3}
.tarot-card .pol-img img{width:100%;height:100%;object-fit:cover}
.pol-wave{position:absolute;left:18px;right:18px;bottom:40px;display:flex;align-items:center;gap:6px}
.pol-wave svg{flex:1;height:24px;color:var(--blue)}
.pol-code{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);
  color:var(--ink);font-size:11px;letter-spacing:.34em;white-space:nowrap}
.song-head{text-align:left;padding:26px 30px 0}
.song-kicker{font-size:12px;letter-spacing:.32em;color:var(--ink-60)}
.song-title{font-family:var(--serif);font-weight:700;font-size:clamp(27px,8vw,34px);letter-spacing:.04em;line-height:1.35;padding:8px 0 2px;color:var(--ink)}
.song-thesis{font-size:14px;color:var(--ink-60);line-height:1.75;padding-top:6px}
.card-tip{text-align:center;font-size:12px;color:var(--ink-60);letter-spacing:.14em;padding-top:16px}
.linked-line{text-align:center;font-size:13px;color:var(--ink-60);padding-top:10px}
.linked-line b{color:var(--coral);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 20px 0}
.chip{
  border:1px solid var(--ink-30);color:var(--ink);border-radius:999px;
  padding:5px 14px;font-size:12px;transition:all .22s var(--ease)
}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip:active{transform:scale(.95)}
.music-status{
  margin:18px 26px 0;display:flex;align-items:center;gap:8px;
  border:1px solid rgba(16,23,34,.14);border-radius:12px;padding:10px 12px;font-size:12px;
  color:var(--ink-60);background:rgba(255,255,255,.6)
}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--mint);flex:0 0 auto}
.music-status.is-loading .status-dot{background:var(--gold);animation:pulse 1.1s infinite}
.music-status.is-error .status-dot{background:var(--coral)}
@keyframes pulse{50%{opacity:.35}}
.credit-pill{margin-left:auto;background:rgba(16,23,34,.08);border-radius:999px;padding:2px 10px;font-size:11px;color:var(--ink)}
.song-actions{display:flex;justify-content:center;align-items:center;gap:18px;padding:20px 0 4px}
.lyrics{margin:16px 26px 0;border-top:1px solid rgba(16,23,34,.14);padding-top:14px}
.lyr-head{font-size:12px;letter-spacing:.24em;color:var(--ink-60);text-align:center;padding-bottom:10px}
.lyr-sec{padding:6px 0}
.lyr-label{display:block;font-size:11px;color:var(--blue);letter-spacing:.2em;padding-bottom:4px}
.lyr-line{font-family:var(--serif);font-size:17px;letter-spacing:.06em;line-height:1.9;text-align:center;color:var(--ink)}
.again-line{text-align:center;padding:16px 0 6px}
.again-line button{color:var(--ink-60);font-size:13px;letter-spacing:.14em;border-bottom:1px solid var(--ink-30);padding-bottom:2px}
.hidden{display:none!important}

/* ===== 屏4 · 我的现场（瀑布流唱片架）===== */
.filter-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:4px 16px 18px}
.pill{
  border:1px solid var(--paper-line);border-radius:999px;padding:5px 15px;font-size:12.5px;
  color:var(--ink-60);background:transparent;transition:all .22s var(--ease)
}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill:active{transform:scale(.95)}
.waterfall{columns:3;column-gap:10px;padding:0 14px}
@media(max-width:359px){.waterfall{columns:2}}
.wf-item{
  break-inside:avoid;margin-bottom:10px;border-radius:14px;overflow:hidden;
  background:#fff;box-shadow:0 8px 18px rgba(16,23,34,.10);text-align:left;width:100%;
  display:block;transition:transform .25s var(--ease)
}
.wf-item:active{transform:scale(.96)}
.wf-cover{aspect-ratio:3/4;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.wf-cover .wf-disc{width:56%;aspect-ratio:1/1;border-radius:50%;position:relative;
  background:radial-gradient(circle at center,var(--paper) 0 17%,rgba(16,23,34,.85) 18% 100%);
  box-shadow:0 4px 14px rgba(0,0,0,.3)}
.wf-cover .wf-disc::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:repeating-radial-gradient(circle at center,transparent 0 3px,rgba(255,255,255,.07) 3px 4px)}
.wf-meta{padding:7px 9px 9px}
.wf-meta b{display:block;font-family:var(--serif);font-size:13px;letter-spacing:.03em;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf-meta span{display:block;font-size:10.5px;color:var(--ink-60);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-empty{text-align:center;color:var(--ink-60);font-size:13px;padding:40px 30px}

/* ===== 底部导航 ===== */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  display:grid;grid-template-columns:1fr 84px 1fr;align-items:end;
  padding:10px 26px calc(env(safe-area-inset-bottom) + 12px);z-index:30;
  background:linear-gradient(180deg,rgba(246,240,229,0),var(--paper) 46%);
  transition:transform .3s var(--ease),opacity .3s
}
body[data-screen="song"] .tabbar{transform:translateX(-50%) translateY(110%);opacity:0;pointer-events:none}
.tab-side{display:flex;justify-content:center}
.tab-ico{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .22s var(--ease)}
.tab-ico:active{transform:scale(.9)}
.tab-ico.here{background:var(--ink);color:#fff}
.fab{
  width:66px;height:66px;border-radius:50%;margin-top:-26px;
  background:linear-gradient(135deg,var(--coral),var(--blue));color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:0 14px 30px rgba(241,154,128,.42);border:3px solid var(--paper);
  transition:transform .25s var(--ease)
}
.fab:active{transform:scale(.93)}
.fab span{font-size:10px;letter-spacing:.1em}

/* ===== 显影仪式：卡牌加载态 ===== */
.press{position:fixed;inset:0;z-index:80;background:var(--paper);color:var(--ink);
  display:none;align-items:center;justify-content:center;text-align:center}
.press.show{display:flex}
.press-disc{width:170px;height:230px;border-radius:20px;margin:0 auto 24px;position:relative;
  background:url('./assets/watercolor-polaroid.jpg') center/cover;border:11px solid #fff;
  box-shadow:0 20px 42px rgba(16,23,34,.18);animation:cardPulse 1.8s ease-in-out infinite}
.press-disc::after{content:'';position:absolute;inset:0;border-radius:10px;background:linear-gradient(180deg,rgba(16,23,34,.02),rgba(16,23,34,.35))}
@keyframes cardPulse{50%{transform:translateY(-6px) rotate(1deg)}}
.press h2{font-family:var(--serif);letter-spacing:.14em;font-size:24px;padding-bottom:8px}
.press p{color:var(--ink-60);font-size:13px}

/* ===== 分享 Sheet · 同款竖版卡牌预览 ===== */
.mask{position:fixed;inset:0;background:rgba(16,23,34,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:60}
.mask.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(104%);width:100%;max-width:480px;
  background:var(--paper);border-radius:24px 24px 0 0;z-index:70;transition:transform .34s var(--ease);
  max-height:88dvh;overflow:auto
}
.sheet.open{transform:translateX(-50%) translateY(0)}
.grabber{width:44px;height:5px;border-radius:99px;background:var(--ink-30);margin:12px auto 4px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:8px 20px 12px}
.sheet-head b{font-family:var(--serif);letter-spacing:.1em;font-size:17px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ink-30)}
.sheet-body{padding:0 20px calc(env(safe-area-inset-bottom) + 24px)}
.share-card{
  background:#fffdf8;color:var(--ink);border:2px solid #fff;border-radius:20px;padding:13px;
  box-shadow:0 14px 30px rgba(16,23,34,.14);position:relative;overflow:hidden
}
.sc-brand{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;color:var(--ink-60);padding:2px 4px 10px}
.sc-disc{width:100%;height:184px;border-radius:12px;margin:0 0 13px;position:relative;overflow:hidden;background:url('./assets/watercolor-polaroid.jpg') center/cover}
.sc-disc::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 54%,rgba(16,23,34,.25))}
.sc-disc .sc-label{display:none}
.sc-title{font-family:var(--serif);font-weight:700;font-size:24px;text-align:center;letter-spacing:.06em;line-height:1.35}
.sc-meta{text-align:center;color:var(--ink-60);font-size:10px;padding:6px 0 10px;letter-spacing:.08em}
.sc-lyric{border-top:1px solid var(--paper-line);padding-top:10px;font-family:var(--serif);text-align:center;line-height:1.9;font-size:14px}
.sc-foot{display:flex;justify-content:center;align-items:flex-end;padding-top:13px}
.sc-slogan{font-family:var(--serif);font-size:13px;letter-spacing:.12em;color:#C46B4E}
.sc-link{display:none}
#sheetImg{width:100%;border-radius:14px;display:none;margin-top:12px}
.sheet-hint{font-size:12px;color:var(--ink-60);text-align:center;padding:10px 0}
.sheet-actions{display:grid;gap:10px}
.btn-pill{
  border-radius:999px;padding:13px 18px;text-align:center;font-size:14px;letter-spacing:.08em;
  border:1.5px solid var(--ink);transition:transform .22s var(--ease)
}
.btn-pill.primary{background:var(--ink);color:#fff}
.btn-pill.primary:active{transform:scale(.97)}
.btn-pill:active{transform:scale(.97)}

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:118px;left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:#fff;border-radius:999px;padding:9px 20px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:90;white-space:nowrap
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 迷你播放条（离开歌曲屏后的播放提示）===== */
.player{
  position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);
  width:min(430px,calc(100% - 32px));background:#fff;border-radius:16px;
  display:flex;align-items:center;gap:12px;padding:10px 14px;z-index:40;
  box-shadow:0 16px 36px rgba(16,23,34,.18);opacity:0;pointer-events:none;
  transition:all .3s var(--ease)
}
.player.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.pbtn{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pbtn .i-pause{display:none}
.pbtn .i-play{display:block}
body.playing .pbtn .i-pause{display:block}
body.playing .pbtn .i-play{display:none}
.p-meta{min-width:0;flex:1}
.p-meta strong{display:block;font-family:var(--serif);font-size:14px;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-meta span{font-size:11px;color:var(--ink-60)}
.bars{display:flex;gap:3px;align-items:flex-end;height:18px}
.bars i{width:3px;background:var(--coral);border-radius:2px;height:30%}
body.playing .bars i{animation:eq 0.9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
@keyframes eq{50%{height:95%}}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body data-screen="home">

<div class="phone">

  <!-- ═══ 屏1 · 今晚见 ═══ -->
  <section class="scr scr-home active" id="screenHome">
    <header class="topbar">
      <span class="round-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
      </span>
      <span class="mono" style="font-size:11px;color:var(--ink-60);letter-spacing:.22em">CITY VINYL</span>
    </header>
    <h1 class="big-title" style="font-size:clamp(26px,7.6vw,34px);line-height:1.4">把此歌唱成<br>一场五月天<svg class="star4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1c.8 5.6 4.6 9.4 10.2 10.2C16.6 12 12.8 15.8 12 21.4 11.2 15.8 7.4 12 1.8 11.2 7.4 10.4 11.2 6.6 12 1z"/></svg></h1>
    <div class="wave-sep" aria-hidden="true">
      <svg width="132" height="12" viewBox="0 0 132 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 6h18M26 6c3-5 5-5 8 0s5 5 8 0 5-5 8 0 5 5 8 0 5-5 8 0 5 5 8 0 5-5 8 0"/><path d="M112 6h18"/></svg>
    </div>
    <figure class="stage-art"><img src="./assets/watercolor-stage.jpg" alt="水彩演唱会舞台插画"></figure>
    <div class="entry-row">
      <button class="sticker" id="goDrawBtn">
        <b>抽一首此刻</b><span>三段生活，连去一首歌</span>
      </button>
      <button class="sticker" id="goLiveBtn">
        <b>我的现场</b><span>你刻过的每一张唱片</span>
      </button>
    </div>
    <p class="home-foot">62 个场景核 · 31 首语义曲库 · 原创词库 130+ 行<br>歌词与音乐描述将送入免费开源模型 ACE-Step</p>
    <p class="home-slogan">抽的是生活，刻下来的是歌</p>
  </section>

  <!-- ═══ 屏2 · 抽一首 ═══ -->
  <section class="scr scr-draw" id="screenDraw">
    <header class="topbar">
      <button class="round-icon" id="drawBackBtn" aria-label="回首页"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <span></span>
    </header>
    <h1 class="big-title">抽一首<svg class="star4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1c.8 5.6 4.6 9.4 10.2 10.2C16.6 12 12.8 15.8 12 21.4 11.2 15.8 7.4 12 1.8 11.2 7.4 10.4 11.2 6.6 12 1z"/></svg></h1>
    <p class="draw-hint" id="slotHint">还差 3 段</p>
    <div id="flowSec">
      <div class="fan" id="slots" aria-live="polite"></div>
      <div id="stage" aria-live="polite"></div>
      <div class="circle-row">
        <button class="btn-circle small light-btn" id="swapDrawBtn" aria-label="换一段看看">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="btn-circle" id="mainBtn" aria-label="抽一段新的此刻">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 2c.7 4.9 4 8.2 9 9-5 .8-8.3 4.1-9 9-.7-4.9-4-8.2-9-9 5-.8 8.3-4.1 9-9z"/></svg>
          <span class="bc-label" id="mainBtnText">抽一段</span>
        </button>
      </div>
      <p class="main-label" id="flowLabel">此刻 · 连去五月天的歌</p>
    </div>
  </section>

  <!-- ═══ 屏3 · 此刻的歌 ═══ -->
  <section class="scr scr-song" id="screenSong">
    <header class="topbar">
      <button class="round-icon ghost" id="closeSongBtn" aria-label="回到首页"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <button class="round-icon ghost" id="loopSongBtn" aria-label="换一版歌词"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button>
    </header>
    <section class="record hidden" id="recordSec">

      <div class="song-head">
        <div class="song-kicker mono">刻好了 · 此刻的歌</div>
        <h2 class="song-title" id="recTitle"></h2>
        <p class="song-thesis" id="recThesis"></p>
        <input type="hidden" id="coverTitle">
      </div>
      <div class="tarot-card">
        <div class="pol-img"><img src="./assets/watercolor-polaroid.jpg" alt="聚光灯下的水彩演出"></div>
        <div class="pol-wave" aria-hidden="true">
          <svg viewBox="0 0 300 26" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 13h14M24 13c4-8 7-8 11 0s7 8 11 0 7-8 11 0 7 8 11 0 7-8 11 0 7 8 11 0 7-8 11 0 7 8 11 0 7-8 11 0 7 8 11 0 7-8 11 0 7 8 11 0 7-8 11 0 7 8 11 0 7-8 11 0 7 8 11 0 7-8 11 0 7 8 11 0"/><path d="M282 13h14"/></svg>
          <span class="credit-pill" id="creditBadge" title="免费生成额度">免费额度 3</span>
        </div>
        <span class="pol-code mono" id="coverCode"></span>
      </div>
      <p class="card-tip">轻触下方圆钮，听这首为你写的歌</p>
      <p class="linked-line">它的情绪，连着 <b id="linkedSong"></b></p>
      <div id="swapRow"><div class="chips" id="swapChips"></div></div>

      <div class="music-status" id="musicStatus" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="musicStatusText">正在准备免费文字生音乐……</span>
      </div>

      <div class="song-actions">
        <button class="btn-circle small light-btn hidden" id="remixBtn" aria-label="换一版歌词">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="btn-circle" id="playBtn" aria-label="播放这首原创歌">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M8 5.4v13.2a.7.7 0 0 0 1.05.6l11-6.6a.7.7 0 0 0 0-1.2l-11-6.6A.7.7 0 0 0 8 5.4z"/></svg>
        </button>
        <button class="btn-circle small light-btn" id="shareBtn" aria-label="生成分享卡">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
        </button>
      </div>

      <div class="lyrics">
        <div class="lyr-head">原创歌词草稿 · A 面</div>
        <div id="lyricSheet"></div>
      </div>

      <div class="again-line"><button id="againBtn">重新抽三段，再刻一张</button></div>
    </section>
  </section>

  <!-- ═══ 屏4 · 我的现场 ═══ -->
  <section class="scr scr-live" id="screenLive">
    <header class="topbar">
      <button class="round-icon" id="liveBackBtn" aria-label="回首页"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <span class="mono" id="shelfCount" style="font-size:11px;color:var(--ink-60)"></span>
    </header>
    <h1 class="big-title">我的现场<svg class="star4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1c.8 5.6 4.6 9.4 10.2 10.2C16.6 12 12.8 15.8 12 21.4 11.2 15.8 7.4 12 1.8 11.2 7.4 10.4 11.2 6.6 12 1z"/></svg></h1>
    <div class="filter-row" id="moodFilter"></div>
    <div class="waterfall" id="shelfList"></div>
  </section>

  <!-- ═══ 底部导航 ═══ -->
  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <span class="tab-side">
      <button class="tab-ico here" id="tabHome" aria-label="首页">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2z"/></svg>
      </button>
    </span>
    <button class="fab" id="tabDraw" aria-label="去抽一首">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12h3M19 12h3M6 9v6M10 6v12M14 8v8M18 10v4"/></svg>
      <span>抽一首</span>
    </button>
    <span class="tab-side">
      <button class="tab-ico" id="tabLive" aria-label="我的现场">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c1.2-3.8 4-6 7.5-6s6.3 2.2 7.5 6"/></svg>
      </button>
    </span>
  </nav>
</div>

<!-- 刻盘显影 -->
<div class="press" id="pressOverlay">
  <div>
    <div class="press-disc" aria-hidden="true"></div>
    <div class="kicker mono" style="font-size:11px;letter-spacing:.3em;color:var(--ink-60)">正在刻盘</div>
    <h2>正在写你的原创歌</h2>
    <p id="pressText">翻出你的三段此刻……</p>
  </div>
</div>

<audio id="generatedAudio" preload="metadata"></audio>

<!-- 迷你播放条：离开歌曲屏后的播放提示 -->
<div class="player" id="player">
  <button class="pbtn" id="playerBtn" aria-label="播放或暂停">
    <svg class="i-play" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 4.8v14.4a.6.6 0 0 0 .9.52l11.6-7.2a.6.6 0 0 0 0-1.04L7.9 4.28a.6.6 0 0 0-.9.52z" fill="currentColor"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1.2" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1.2" fill="currentColor"/></svg>
  </button>
  <div class="p-meta"><strong id="nowPlaying">准备播放</strong><span id="nowMeta"></span></div>
  <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
</div>

<!-- 分享 Sheet -->
<div class="mask" id="sheetMask"></div>
<section class="sheet" id="shareSheet" role="dialog" aria-label="分享这张唱片">
  <div class="grabber" id="sheetGrabber" aria-hidden="true"></div>
  <div class="sheet-head"><b>分享这张唱片</b>
    <button class="icon-btn" id="sheetClose" aria-label="关闭"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="sheet-body">
    <div class="share-card">
      <div class="sc-brand"><span>城市唱片 / CITY VINYL</span><span id="scDate" class="mono"></span></div>
      <div class="sc-disc" aria-hidden="true"><div class="sc-label"></div></div>
      <div class="sc-title" id="scTitle"></div>
      <div class="sc-meta mono" id="scMeta"></div>
      <div class="sc-lyric" id="scLyric"></div>
      <div class="sc-foot"><div class="sc-slogan">把此歌唱成一场五月天</div><div class="sc-link" id="scLink"></div></div>
    </div>
    <img id="sheetImg" alt="分享卡图片">
    <p class="sheet-hint" id="sheetHint">在手机上会直接存入相册；也可以长按卡片保存。</p>
    <div class="sheet-actions">
      <button class="btn-pill primary" id="saveCardBtn">保存分享图到相册</button>
      <button class="btn-pill" id="copyLinkBtn">复制唱片链接</button>
      <button class="btn-pill credit-btn" id="claimShareBtn"><span>我分享给朋友了 · 领 +1 免费额度</span></button>
    </div>
  </div>
</section>

<div class="toast" id="toast" role="status"></div>

<script src="./app.js"></script>
</body>
</html>
